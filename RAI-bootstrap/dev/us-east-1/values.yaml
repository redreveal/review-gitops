bootstrap:
  image: "053522176595.dkr.ecr.us-east-1.amazonaws.com/dev/reveal_ai/bootstrap"
  tag: "Latest"
  env:
    - name: "s3-bucketname"
      value: "dev-us-east-1-reveal-ai"
    - name: "sql-hostname"
      valueFrom:
        secretKeyRef:
          name: bootstrap-sql-credentials
          key: sql-hostname
    - name: "sql-username"
      valueFrom:
        secretKeyRef:
          name: bootstrap-sql-credentials
          key: sql-username
    - name: "sql-password"
      valueFrom:
        secretKeyRef:
          name: bootstrap-sql-credentials
          key: sql-password
    - name: "encryptionKey"
      valueFrom:
        secretKeyRef:
          name: bootstrap-sql-credentials
          key: rai-encryption-key
    - name: "BRAINSPACE_URL"
      valueFrom:
        secretKeyRef:
          name: bootstrap-sql-credentials
          key: brainspace-url
    - name: "DBN"
      value: "NexLPAdmin"
    - name: "AWSRegion"
      value: "us-east-1"
  nodeSelector:
    kubernetes.io/os: windows
    kubernetes.io/arch: amd64
  tolerations:
    - key: windows_reveal_ai
      value: execution
      effect: NoSchedule