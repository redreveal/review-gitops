name: Review-GitOps Manual Modifications

on:
  push:
    paths:
      - 'dev/**'
      - 'prod/**'
      - 'uat/**'
      - 'gov/**'

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      dev_changed: ${{ steps.determine-environment.outputs.dev_changed }}
      uat_changed: ${{ steps.determine-environment.outputs.uat_changed }}
      prod_changed: ${{ steps.determine-environment.outputs.prod_changed }}
      gov_changed: ${{ steps.determine-environment.outputs.gov_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Determine Environment
        id: determine-environment
        uses: ./.github/actions/determine-environments
      - name: Setup Dependencies
        uses: ./.github/actions/dependencies


  push_production_values_to_argocd:
    needs: determine-environment
    if: needs.determine-environment.outputs.prod_changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Repositories
        uses: ./.github/actions/setup
        with:
          repo_token: ${{ secrets.TOKEN }}

      - name: Push Production Values to ArgoCD
        uses: ./.github/actions/push_values_to_argocd_gitops_repo
        with:
          env_type: 'prod'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notify Summaries
        uses: ./.github/actions/gitops_slack_notify
        with:
          env_type: 'prod'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

  push_dev_values_to_argocd:
    needs: determine-environment
    if: needs.determine-environment.outputs.dev_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Repositories
        uses: ./.github/actions/setup
        with:
          repo_token: ${{ secrets.TOKEN }}

      - name: Push Dev Values to ArgoCD
        uses: ./.github/actions/push_values_to_argocd_gitops_repo
        with:
          env_type: 'dev'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notify Summaries
        uses: ./.github/actions/gitops_slack_notify
        with:
          env_type: 'dev'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

  collect_uat_review_tags:
    needs: determine-environment
    if: needs.determine-environment.outputs.uat_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.collect.outputs.tags_json }}
      tags_lines: ${{ steps.collect.outputs.tags_lines }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Setup Dependencies
        uses: ./.github/actions/dependencies

      - name: Collect changed review tags (default + MSA)
        id: collect
        uses: ./.github/actions/gitops_promote_images
        with:
          env_file: uat/eu-west-1/versions.yaml
          family: review
      - name: Debug collector outputs
        shell: bash
        run: |
          echo "---- DEBUG: Show env_file basics ----"
          head -n 80 uat/eu-west-1/versions.yaml || true
          echo "---- DEBUG: yq reads ----"
          echo "defaults.review.default:"
          yq e -j '.defaults.review.default // ""' uat/eu-west-1/versions.yaml | jq -r .
          echo "msas review defaults (non-empty only):"
          yq e -j '.msas // {}' uat/eu-west-1/versions.yaml | jq -r '[to_entries[] | (.value.review.default // "")] | map(select(. != "")) | .[]?'
          echo "---- DEBUG: step outputs ----"
          echo "tags_json='${{ steps.collect.outputs.tags_json }}'"
          printf 'tags_lines<<EOL\n%s\nEOL\n' "${{ steps.collect.outputs.tags_lines }}"

  promote_review_tags_sequential:
    needs: [ determine-environment, collect_uat_review_tags ]
    if: needs.determine-environment.outputs.uat_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_tag: ${{ fromJson(
          (
          needs.collect_uat_review_tags.outputs.msa_tags_json != '' &&
          needs.collect_uat_review_tags.outputs.msa_tags_json != '[]' &&
          needs.collect_uat_review_tags.outputs.msa_tags_json
          ) || '["__NO_TAGS__"]'
         ) }}
    steps:
      - name: Debug
        run: |
          echo "default_tag='${{ needs.collect_uat_review_tags.outputs.default_tag }}'"
          echo "msa_tags_json='${{ needs.collect_uat_review_tags.outputs.msa_tags_json }}'"
          echo "matrix.image_tag='${{ matrix.image_tag }}'"

      - name: Nothing to promote (skip)
        if: matrix.image_tag == '__NO_TAGS__'
        run: echo "No MSA override tags to promote."

      - name: Echo the Tag (real work goes here)
        if: matrix.image_tag != '__NO_TAGS__'
        run: echo "image tag ${{ matrix.image_tag }}"


  push_uat_values_to_argocd:
    needs: [determine-environment, collect_uat_review_tags, promote_review_tags_sequential]
    if: needs.determine-environment.outputs.uat_changed == 'true'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Repositories
        uses: ./.github/actions/setup
        with:
          repo_token: ${{ secrets.TOKEN }}

      - name: Push UAT Values to ArgoCD
        uses: ./.github/actions/push_values_to_argocd_gitops_repo
        with:
          env_type: 'uat'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notify Summaries
        uses: ./.github/actions/gitops_slack_notify
        with:
          env_type: 'uat'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

  push_gov_values_to_argocd:
    needs: determine-environment
    if: needs.determine-environment.outputs.gov_changed == 'true'
    runs-on: ubuntu-latest
    environment: gov
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Repositories
        uses: ./.github/actions/setup
        with:
          repo_token: ${{ secrets.TOKEN }}

      - name: Push Gov Values to ArgoCD
        uses: ./.github/actions/push_values_to_argocd_gitops_repo
        with:
          env_type: 'gov'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

      - name: Slack Notify Summaries
        uses: ./.github/actions/gitops_slack_notify
        with:
          env_type: 'gov'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
