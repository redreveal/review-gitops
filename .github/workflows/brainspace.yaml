name: Brainspace-GitOps Workflow

on:
  push:
    paths:
      - 'dev/us-east-1/values.yaml'


jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      prod_changed: ${{ steps.determine-structure.outputs.prod_changed }}
      dev_changed: ${{ steps.determine-structure.outputs.dev_changed }}
      uat_changed: ${{ steps.determine-structure.outputs.uat_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - uses: ./.github/actions/determine-environments
        id: determine-structure


      - name: changes
        run: |
          echo "prod change ${{ steps.determine-structure.outputs.prod_changed }}"
          echo "dev change ${{ steps.determine-structure.outputs.dev_changed }}"
          echo "uat change ${{ steps.determine-structure.outputs.uat_changed }}"



  update-brainspace-dev:
    needs: determine-environment
    if: ${{ needs.determine-environment.outputs.dev_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brainspace-gitops

      -  uses: actions/checkout@v2
         with:
          repository: redreveal/argocd-gitops-versions
          token: ${{ secrets.TOKEN }}
          path: argocd-gitops

      - name: Copy Files from brainspace to argocd-gitops-versions
        run: |
          rsync -av --exclude='.git' brainspace-gitops/dev/us-east-1/values.yaml argocd-gitops/brainspace/dev/us-east-1

      - name: Helm changed files
        uses: actions/github-script@v5
        with:
          script: |
            const payload = context.payload;
            const repo = context.repo;
              
            let base, head;
            if (payload.pull_request) {
              base = payload.pull_request.base.sha;
              head = payload.pull_request.head.sha;
            } else {
              base = payload.before;
              head = payload.after;
            }
            const compare = await github.rest.repos.compareCommits({
              owner: repo.owner,
              repo: repo.repo,
              base,
              head
            });
            const fs = require('fs');
            const helmFiles = [];
            compare.data.files.forEach(file => {
              if (file.filename.includes('values.yaml')) {
                helmFiles.push(file.filename);
              }
            });
            fs.writeFileSync('helm_changed_files.json', JSON.stringify(helmFiles));

      - name: Slack Notify Summaries
        uses: ./brainspace-gitops/.github/actions/gitops_slack_notify
        with:
          env_type: 'dev'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}


  update-reveal-ai-uat:
    needs: determine-environment
    if: ${{ needs.determine-environment.outputs.uat_changed == 'true' }}
    environment: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: revealai-gitops

      - uses: actions/checkout@v2
        with:
          repository: redreveal/argocd-gitops-versions
          token: ${{ secrets.TOKEN }}
          path: argocd-gitops

      - name: Copy Files from revealai-gitops/RAI to argocd-gitops-versions
        run: |
          rsync -av --exclude='.git' revealai-gitops/RAI/uat/ argocd-gitops/reveal-ai/uat/

      - name: Copy Files from revealai-gitops/RAI-bootstrap/RAI to argocd-gitops-versions
        run: |
          rsync -av --exclude='.git' revealai-gitops/RAI-bootstrap/uat/ argocd-gitops/reveal-ai-bootstrap/uat/

      - name: Gather changed Helm files
        uses: actions/github-script@v5
        with:
          script: |
            const payload = context.payload;
            const repo = context.repo;

            let base, head;
            if (payload.pull_request) {
              base = payload.pull_request.base.sha;
              head = payload.pull_request.head.sha;
            } else {
              base = payload.before;
              head = payload.after;
            }
            const compare = await github.rest.repos.compareCommits({
              owner: repo.owner,
              repo: repo.repo,
              base,
              head
            });
            const fs = require('fs');
            const helmFiles = [];
            compare.data.files.forEach(file => {
              if (file.filename.includes('values.yaml') && file.filename.includes('RAI/')) {
                helmFiles.push(file.filename);
              }
            });
            fs.writeFileSync('helm_changed_files.json', JSON.stringify(helmFiles));
            console.log(`Helm files: ${JSON.stringify(helmFiles)}`);

      - name: Slack Notify Summaries
        uses: ./revealai-gitops/.github/actions/gitops_slack_notify
        with:
          env_type: 'uat'
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
