name: Collect family default + MSA tags (yq 4.6.1)
description: Read defaults.<family>.default and all msas.*.<family>.default
inputs:
  env_file:
    required: true
  family:
    required: true
outputs:
  default_tag:
    description: 'defaults.<family>.default tag'
    value: ${{ steps.collect.outputs.default_tag }}
  msa_tags_lines:
    description: 'MSA override tags, newline-separated'
    value: ${{ steps.collect.outputs.msa_tags_lines }}
  msa_tags_json:
    description: 'MSA override tags, JSON array'
    value: ${{ steps.collect.outputs.msa_tags_json }}
  tags_lines:
    description: 'All tags (default + MSA), newline-separated'
    value: ${{ steps.collect.outputs.tags_lines }}
  tags_json:
    description: 'All tags (default + MSA), JSON array'
    value: ${{ steps.collect.outputs.tags_json }}
runs:
  using: "composite"
  steps:
    - id: collect
      shell: bash
      run: |
        set -euo pipefail
        FILE="${{ inputs.env_file }}"
        FAMILY="${{ inputs.family }}"

        # Read default
        DEF="$(yq e -j ".defaults[\"$FAMILY\"].default // \"\"" "$FILE" | jq -r . | tr -d '\r' | xargs || true)"

        # Read MSA defaults
        MSAS_JSON="$(yq e -j '.msas // {}' "$FILE" | tr -d '\r' || echo '{}')"
        MSA_TAGS="$(jq -r --arg f "$FAMILY" '
          [to_entries[] | (.value[$f].default // "")] | map(select(. != "")) | .[]
        ' <<< "$MSAS_JSON" 2>/dev/null || true)"

        # Build full list (default + MSA), dedupe
        TMP="$(mktemp)"; : > "$TMP"
        [ -n "$DEF" ] && printf '%s\n' "$DEF" >> "$TMP"
        if [ -n "${MSA_TAGS:-}" ]; then
          while IFS= read -r t; do
            [ -n "$t" ] && printf '%s\n' "$t" >> "$TMP"
          done <<< "$MSA_TAGS"
        fi

        DEDUP_ALL="$(mktemp)"
        if [ -s "$TMP" ]; then
          sort -u "$TMP" | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' > "$DEDUP_ALL"
        else
          : > "$DEDUP_ALL"
        fi

        # JSON (all)
        ALL_JSON="$(awk 'NF{print}' "$DEDUP_ALL" | jq -R . | jq -cs .)"
        [ -z "$ALL_JSON" ] && ALL_JSON="[]"

        # Filtered MSA-only (remove DEF if present)
        if [ -n "$DEF" ]; then
          MSA_JSON="$(jq --arg def "$DEF" 'map(select(. != $def))' <<< "$ALL_JSON")"
        else
          MSA_JSON="$ALL_JSON"
        fi

        # Lines (MSA-only)
        DEDUP_MSA="$(mktemp)"
        if [ -n "$DEF" ]; then
          grep -vx -- "$DEF" "$DEDUP_ALL" > "$DEDUP_MSA" || : 
        else
          cp "$DEDUP_ALL" "$DEDUP_MSA"
        fi

        # Outputs
        echo "default_tag=$DEF" >> "$GITHUB_OUTPUT"

        # msa_tags_lines (heredoc)
        delim_msa="EOF_MSA_${RANDOM}_$(date +%s%N)"
        {
          echo "msa_tags_lines<<$delim_msa"
          cat "$DEDUP_MSA"
          echo "$delim_msa"
        } >> "$GITHUB_OUTPUT"

        # msa_tags_json
        echo "msa_tags_json=${MSA_JSON}" >> "$GITHUB_OUTPUT"

        # Keep the original “all tags” outputs
        delim_all="EOF_ALL_${RANDOM}_$(date +%s%N)"
        {
          echo "tags_lines<<$delim_all"
          cat "$DEDUP_ALL"
          echo "$delim_all"
        } >> "$GITHUB_OUTPUT"
        echo "tags_json=${ALL_JSON}" >> "$GITHUB_OUTPUT"
