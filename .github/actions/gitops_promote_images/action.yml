name: Collect family default + MSA tags (simple, yq 4.6.1-safe)
description: Read defaults.<family>.default and all msas.*.<family>.default as a unique tag list
inputs:
  env_file:
    required: true
  family:
    required: true
outputs:
  tags_lines:
    description: 'Newline-separated list of tags'
    value: ${{ steps.collect.outputs.tags_lines }}
  tags_json:
    description: 'JSON array of tags'
    value: ${{ steps.collect.outputs.tags_json }}
runs:
  using: "composite"
  steps:
    - id: collect
      shell: bash
      run: |
        set -euo pipefail
        FILE="${{ inputs.env_file }}"
        FAMILY="${{ inputs.family }}"

        if [ ! -f "$FILE" ]; then
          delim="EOF_${RANDOM}_$(date +%s%N)"
          {
            echo "tags_lines<<$delim"
            # intentionally empty
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo 'tags_json=[]' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # yq 4.6.1: use eval + -j; for scalar use jq -r to unwrap
        DEF="$(yq e -j ".defaults[\"$FAMILY\"].default // \"\"" "$FILE" | jq -r . | tr -d '\r' | xargs || true)"
        MSAS_JSON="$(yq e -j '.msas // {}' "$FILE" | tr -d '\r' || echo '{}')"

        # Pull all msas.*.<family>.default non-empty strings
        MSA_TAGS="$(jq -r --arg f "$FAMILY" '
          [ to_entries[] | (.value[$f].default // "") ] 
          | map(select(. != "")) | .[]
        ' <<< "$MSAS_JSON" 2>/dev/null || true)"

        # Build a temp list, dedupe, strip empties
        TMP="$(mktemp)"
        : > "$TMP"
        [ -n "${DEF:-}" ] && printf '%s\n' "$DEF" >> "$TMP"
        if [ -n "${MSA_TAGS:-}" ]; then
          while IFS= read -r t; do
            [ -n "$t" ] && printf '%s\n' "$t" >> "$TMP"
          done <<< "$MSA_TAGS"
        fi

        DEDUP="$(mktemp)"
        if [ -s "$TMP" ]; then
          sort -u "$TMP" | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' > "$DEDUP"
        else
          : > "$DEDUP"
        fi

        # Output 1: newline-separated tags via a CLEAN heredoc (no indent, no quotes/commas)
        delim="EOF_${RANDOM}_$(date +%s%N)"
        {
          echo "tags_lines<<$delim"
          cat "$DEDUP"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

        # Output 2: compact JSON array on ONE line (prevents file-command parse issues)
        TAGS_JSON="$(awk 'NF{print}' "$DEDUP" | jq -R . | jq -cs .)"
        [ -z "$TAGS_JSON" ] && TAGS_JSON="[]"
        echo "tags_json=${TAGS_JSON}" >> "$GITHUB_OUTPUT"
