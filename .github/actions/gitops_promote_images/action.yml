name: Collect changed MSA override versions (yq 4.6.1)
description: Returns only changed msas.*.<component>.default values vs previous commit (as a JSON array of strings)
inputs:
  env_file:
    required: true
    description: 'Path to versions.yaml (e.g., uat/eu-west-1/versions.yaml)'
  component:
    required: true
    description: 'Component key (e.g., review, processing, reveal_ai)'
outputs:
  msa_tags_json:
    description: 'Changed MSA override versions (JSON array of strings)'
    value: ${{ steps.collect.outputs.msa_tags_json }}
runs:
  using: "composite"
  steps:
    - id: collect
      shell: bash
      run: |
        set -euo pipefail
        file="${{ inputs.env_file }}"
        component="${{ inputs.component }}"

        # Ensure we can compare to previous commit of this file (caller should use fetch-depth: 2)
        prev_file="$(mktemp)"
        if git show "HEAD^:${file}" >"$prev_file" 2>/dev/null; then
          has_prev=1
        else
          has_prev=0
        fi

        # Read current msas block as JSON
        current_msas_json="$(yq e -j '.msas // {}' "$file" | tr -d '\r' || echo '{}')"
        # Extract current msas.*.<component>.default (non-empty), one per line
        current_msa_versions="$(
          jq -r --arg c "$component" '
            [ to_entries[] | (.value[$c].default // "") ]
            | map(select(. != "")) | .[]
          ' <<< "$current_msas_json" 2>/dev/null || true
        )"

        # Read previous msas (if available) and extract versions
        if [ "$has_prev" -eq 1 ]; then
          previous_msas_json="$(yq e -j '.msas // {}' "$prev_file" | tr -d '\r' || echo '{}')"
          previous_msa_versions="$(
            jq -r --arg c "$component" '
              [ to_entries[] | (.value[$c].default // "") ]
              | map(select(. != "")) | .[]
            ' <<< "$previous_msas_json" 2>/dev/null || true
          )"
        else
          previous_msa_versions=""
        fi

        # Build sets (unique, one per line)
        current_set="$(mktemp)"; : > "$current_set"
        previous_set="$(mktemp)"; : > "$previous_set"

        if [ -n "${current_msa_versions:-}" ]; then
          printf '%s\n' $current_msa_versions \
            | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' \
            | sort -u > "$current_set"
        fi

        if [ -n "${previous_msa_versions:-}" ]; then
          printf '%s\n' $previous_msa_versions \
            | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' \
            | sort -u > "$previous_set"
        fi

        # CHANGED = current - previous (or all current if no previous)
        changed_set="$(mktemp)"; : > "$changed_set"
        if [ -s "$current_set" ]; then
          if [ -s "$previous_set" ]; then
            comm -23 "$current_set" "$previous_set" > "$changed_set"
          else
            cp "$current_set" "$changed_set"
          fi
        fi

        # Emit JSON array of strings (single-line, safe for $GITHUB_OUTPUT)
        if [ -s "$changed_set" ]; then
          json="$(awk 'NF{print}' "$changed_set" | jq -R . | jq -cs . | jq -c .)"
        else
          json='["__NO_TAGS__"]'
        fi
        printf 'msa_tags_json=%s\n' "$json" >> "$GITHUB_OUTPUT"