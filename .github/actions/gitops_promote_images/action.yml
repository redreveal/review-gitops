name: Collect component MSA override versions (yq 4.6.1)
description: Reads defaults.<component>.default and msas.*.<component>.default, returns MSA-only versions as JSON
inputs:
  env_file:
    required: true
    description: 'Path to versions.yaml (e.g., uat/eu-west-1/versions.yaml)'
  component:
    required: true
    description: 'Component key (e.g., review, processing, reveal_ai)'
outputs:
  msa_tags_json:
    description: 'MSA override versions (JSON array of strings)'
    value: ${{ steps.collect.outputs.msa_tags_json }}
runs:
  using: "composite"
  steps:
    - id: collect
      shell: bash
      run: |
        set -euo pipefail
        file="${{ inputs.env_file }}"
        comp="${{ inputs.component }}"

        # Read the global default for the component
        default_version="$(yq e -j ".defaults[\"$comp\"].default // \"\"" "$file" \
          | jq -r . | tr -d '\r' | xargs || true)"

        # Read msas block as JSON
        msas_json="$(yq e -j '.msas // {}' "$file" | tr -d '\r' || echo '{}')"

        # Pull all msas.*.<component>.default values (one per MSA), non-empty
        msa_versions_raw="$(jq -r --arg c "$comp" '
          [ to_entries[] | (.value[$c].default // "") ]
          | map(select(. != "")) | .[]
        ' <<< "$msas_json" 2>/dev/null || true)"

        # Build a newline list with default + MSA versions, then dedupe
        all_versions_file="$(mktemp)"; : > "$all_versions_file"
        [ -n "$default_version" ] && printf '%s\n' "$default_version" >> "$all_versions_file"
        if [ -n "${msa_versions_raw:-}" ]; then
          while IFS= read -r v; do
            [ -n "$v" ] && printf '%s\n' "$v" >> "$all_versions_file"
          done <<< "$msa_versions_raw"
        fi

        unique_all_versions="$(mktemp)"; : > "$unique_all_versions"
        if [ -s "$all_versions_file" ]; then
          sort -u "$all_versions_file" | sed -e 's/\r$//' -e '/^[[:space:]]*$/d' > "$unique_all_versions"
        fi

        # Convert to JSON array of strings (quoted)
        all_json="$(awk 'NF{print}' "$unique_all_versions" | jq -R . | jq -cs .)"
        [ -z "$all_json" ] && all_json='[]'
        all_json_compact="$(jq -c . <<<"$all_json")"

        # Remove the global default from the list to get MSA-only versions
        if [ -n "$default_version" ]; then
          msa_json_compact="$(jq -c --arg def "$default_version" 'map(select(. != $def))' <<<"$all_json_compact")"
        else
          msa_json_compact="$all_json_compact"
        fi

        # Single-line output (safe for $GITHUB_OUTPUT)
        printf 'msa_tags_json=%s\n' "$msa_json_compact" >> "$GITHUB_OUTPUT"
