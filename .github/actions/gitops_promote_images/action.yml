name: Collect family default + MSA tags (simple, yq v4.6.1)
description: Read defaults.<family>.default and all msas.*.<family>.default as a unique tag list
inputs:
  env_file:
    description: 'Path to versions.yaml (e.g., uat/eu-west-1/versions.yaml)'
    required: true
  family:
    description: 'Family key (e.g., review)'
    required: true
outputs:
  tags_lines:
    description: 'Newline-separated list of tags (safe for simple loops)'
  tags_json:
    description: 'JSON array of tags (for matrix if desired)'
runs:
  using: "composite"
  steps:
    - id: collect
      shell: bash
      run: |
        set -euo pipefail
        FILE="${{ inputs.env_file }}"
        FAMILY="${{ inputs.family }}"

        if [ ! -f "$FILE" ]; then
          {
            echo "tags_lines<<__EOF__"
            echo
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo 'tags_json=[]' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # yq 4.6.1: use eval (-j to JSON) + jq for scalars
        DEF=$(yq e -j ".defaults[\"$FAMILY\"].default // \"\"" "$FILE" | jq -r . | tr -d '\r' | xargs)

        MSAS_JSON=$(yq e -j '.msas // {}' "$FILE")
        # Extract all msas.*.<family>.default values (if present)
        MSA_TAGS=$(jq -r --arg f "$FAMILY" '
          [ to_entries[]
            | (.value[$f].default // "")
          ]
          | map(select(. != ""))
          | .[]
        ' <<< "$MSAS_JSON" 2>/dev/null || true)

        TMP=/tmp/tags.$$
        : > "$TMP"
        [ -n "$DEF" ] && echo "$DEF" >> "$TMP"
        if [ -n "${MSA_TAGS:-}" ]; then
          # shellcheck disable=SC2129
          while IFS= read -r t; do
            [ -n "$t" ] && echo "$t" >> "$TMP"
          done <<< "$MSA_TAGS"
        fi

        if [ -s "$TMP" ]; then
          sort -u "$TMP" | sed 's/\r$//' > /tmp/tags_uniq.$$
        else
          : > /tmp/tags_uniq.$$
        fi

        # Output newline-separated list safely via heredoc (no format errors)
        {
          echo "tags_lines<<__EOF__"
          cat /tmp/tags_uniq.$$
          echo "__EOF__"
        } >> "$GITHUB_OUTPUT"

        # Also provide JSON array (correctly formatted)
        TAGS_JSON=$(awk 'NF{print}' /tmp/tags_uniq.$$ | jq -R . | jq -s .)
        echo "tags_json=$TAGS_JSON" >> "$GITHUB_OUTPUT"
