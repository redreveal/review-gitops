name: "GitOps Slack Notify"
description: "Handle Slack notifications for both review-gitops (region_envs.json) and reveal-ai (helm)."

inputs:
  slack_webhook:
    description: "Slack Webhook URL"
    required: false  # can be optional if you want to skip Slack sometimes

runs:
  using: "composite"
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        pip install requests pyyaml

    - name: Slack Notify Summaries
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
      run: |
        set -e

        if [ -z "$SLACK_WEBHOOK" ]; then
          echo "No Slack webhook. Skipping."
          exit 0
        fi

        # If region_envs.json => do review approach
        if [ -f "review-gitops/regions_envs.json" ]; then
          echo "Detected region_envs.json => We'll do the 'review' approach."

          regions_envs=$(cat review-gitops/regions_envs.json | jq -r '.[] | @base64')
          if [ -z "$regions_envs" ]; then
            echo "No changed regions in region_envs.json. Skipping Slack notify."
            exit 0
          fi

          for region_env in $regions_envs; do
            _jq() {
              echo "$region_env" | base64 --decode | jq -r ${1}
            }
            REGION=$(_jq '.region')
            ENV=$(_jq '.env')
            
            echo "Posting Slack for $ENV/$REGION..."
            # We assume "versions.yaml" in "review-gitops/$ENV/$REGION/"
            FILE="review-gitops/${ENV}/${REGION}/versions.yaml"

            if [ -f "$FILE" ]; then
              python $GITHUB_ACTION_PATH/unified_process_values.py "$FILE" "$ENV" "$REGION" "auto"
            else
              echo "File $FILE not found, skipping $ENV/$REGION"
            fi
          done
        else
          # Fallback => reveal-ai approach
          if [ ! -f "helm_changed_files.json" ]; then
            echo "No helm_changed_files.json found => no Slack for reveal."
            exit 0
          fi

          changed_files=$(cat helm_changed_files.json | jq -r '.[]')
          if [ -z "$changed_files" ]; then
            echo "Empty helm_changed_files.json => skipping Slack."
            exit 0
          fi
          
          
          #DONT FORGET TO REMOVE
          cd revealai-gitops
          for f in $changed_files; do
            # parse environment/region from the path
            # e.g. "revealai-gitops/RAI/dev/us-east-1/values.yaml"
            # remove everything before "RAI/" ...
            after_rai=$(echo "$f" | sed 's|.*RAI/||')
            # => "dev/us-east-1/values.yaml"
            ENV=$(echo "$after_rai" | cut -d'/' -f1)
            REGION=$(echo "$after_rai" | cut -d'/' -f2)

            echo "Slack for $ENV/$REGION => $f"
            python $GITHUB_ACTION_PATH/slack_notify.py "$f" "$ENV" "$REGION" "helm"
          done
        fi
        echo "Done Slack notifications."
    
