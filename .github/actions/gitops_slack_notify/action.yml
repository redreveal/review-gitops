name: "GitOps Slack Notify"
description: "Automatically detect changed regions from region_envs.json, summarize changes, and post to Slack."

inputs:
  # If you still want to pass an env_type (prod/dev/uat) from the calling workflow, you can.
  env_type:
    description: "Environment type (prod, dev, uat)"
    required: false
    default: ""
  # This Slack webhook is optional—if not present, we skip.
  slack_webhook:
    description: "Slack Webhook for notifications"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Python Dependencies
      shell: bash
      run: |
        pip install requests pyyaml

    - name: Slack Notify for Each Region
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
      run: |
        set -e

        # 1) Check if region_envs.json exists. If missing, skip or exit gracefully.
        if [ ! -f "review-gitops/regions_envs.json" ]; then
          echo "No 'review-gitops/regions_envs.json' found. Skipping Slack notify."
          exit 0
        fi

        # 2) Read the array from region_envs.json
        regions_envs=$(cat review-gitops/regions_envs.json | jq -r '.[] | @base64')
        if [ -z "$regions_envs" ]; then
          echo "No changed regions found in region_envs.json. Skipping Slack notify."
          exit 0
        fi

        # 3) Loop over each (env, region)
        for region_env in $regions_envs; do
          _jq() {
            echo "${region_env}" | base64 --decode | jq -r ${1}
          }
          REGION=$(_jq '.region')
          ENV=$(_jq '.env')

          # If you want to skip different ENV from inputs.env_type, do:
          if [ -n "${{ inputs.env_type }}" ] && [ "$ENV" != "${{ inputs.env_type }}" ]; then
            echo "Skipping $ENV/$REGION because it doesn't match inputs.env_type..."
            continue
          fi

          echo "Processing Slack notification for ENV=$ENV REGION=$REGION..."
          echo "Listing files inside $GITHUB_ACTION_PATH:"
          ls -R $GITHUB_ACTION_PATH

          # 4) Determine file path & style
          #    If we know "review" style uses "review-gitops/$ENV/$REGION/versions.yaml"
          #    If we know "helm" style uses "argocd-gitops/reveal-ai/$ENV/values.yaml"
          #    This can be done via some condition or naming. Example:
          if [ -f "review-gitops/${ENV}/${REGION}/versions.yaml" ]; then
            FILE_PATH="review-gitops/${ENV}/${REGION}/versions.yaml"
            STYLE="review"
          elif [ -f "argocd-gitops/reveal-ai/${ENV}/values.yaml" ]; then
            FILE_PATH="argocd-gitops/reveal-ai/${ENV}/values.yaml"
            STYLE="helm"
          else
            echo "Could not find a recognized file for $ENV/$REGION. Skipping."
            continue
          fi

          # 5) Call the Python script for each region/file
          python $GITHUB_ACTION_PATH/slack_message.py "$FILE_PATH" "$ENV" "$REGION" "$STYLE"
        done

        echo "Done processing Slack notifications."
